[project]
name = "medtrust-agent"
version = "1.0.0"
description = "A Zero-Trust, Observable LLM Agent Framework for Medical and Pharmaceutical Workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bibin Prathap", email = "bibinprathap@gmail.com" }]
keywords = [
    "zero-trust", "llm-agent", "healthcare-ai", "graphrag", "ai-governance",
    "hipaa", "nist-800-207", "auditability", "observability", "pharmacovigilance",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
repro = ["matplotlib", "numpy", "pytest"]
web = ["fastapi", "uvicorn"]
screenshots = ["playwright"]

[project.urls]
Homepage = "https://bibinprathap.com/"
Paper = "https://edas.info/p35211"
"Parent framework" = "https://github.com/bibinprathap/VeritasGraph"

[tool.pytest.ini_options]
testpaths = ["tests"]
